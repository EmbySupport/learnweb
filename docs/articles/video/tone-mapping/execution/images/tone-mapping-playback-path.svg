<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">Two possible locations for tone mapping in playback</title>
<desc id="desc">Example one: the server tone maps while transcoding and delivers SDR for playback. Example two: the server delivers HDR video unchanged and adaptation happens in the player or display. These examples do not assert support for every app or device.</desc>
<rect width="800" height="460" rx="12" fill="#f7f9fa"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#25333f">
<text x="30" y="41" font-size="23" font-weight="600">Conversion before delivery</text>
<rect x="30" y="64" width="210" height="122" rx="10" fill="#e3f0df"/>
<rect x="292" y="64" width="205" height="122" rx="10" fill="#e4edf5"/>
<rect x="550" y="64" width="220" height="122" rx="10" fill="#e4edf5"/>
<g text-anchor="middle">
<text x="135" y="105" font-size="21" font-weight="600">Emby Server</text>
<text x="135" y="139" font-size="18">Tone-map during</text><text x="135" y="164" font-size="18">video transcoding</text>
<text x="395" y="117" font-size="21" font-weight="600">SDR stream</text><text x="395" y="151" font-size="18">Converted pixels</text>
<text x="660" y="117" font-size="21" font-weight="600">Player / display</text><text x="660" y="151" font-size="18">Present SDR</text>
</g>
<path d="M249 125H280m-10-8 10 8-10 8M507 125H538m-10-8 10 8-10 8" fill="none" stroke="#687887" stroke-width="3"/>
<text x="30" y="246" font-size="23" font-weight="600">Adaptation after HDR delivery</text>
<rect x="30" y="268" width="210" height="122" rx="10" fill="#e4edf5"/>
<rect x="292" y="268" width="205" height="122" rx="10" fill="#e4edf5"/>
<rect x="550" y="268" width="220" height="122" rx="10" fill="#e3f0df"/>
<g text-anchor="middle">
<text x="135" y="310" font-size="21" font-weight="600">Emby Server</text><text x="135" y="344" font-size="18">Pass video through</text><text x="135" y="369" font-size="18">without conversion</text>
<text x="395" y="321" font-size="21" font-weight="600">HDR stream</text><text x="395" y="355" font-size="18">Original video pixels</text>
<text x="660" y="310" font-size="21" font-weight="600">Player / display</text><text x="660" y="344" font-size="18">Adapt to the target</text><text x="660" y="369" font-size="18">as needed</text>
</g>
<path d="M249 329H280m-10-8 10 8-10 8M507 329H538m-10-8 10 8-10 8" fill="none" stroke="#687887" stroke-width="3"/>
<text x="400" y="432" font-size="16" text-anchor="middle" fill="#687887">Conceptual examples · a transcode does not always include tone mapping</text>
</g></svg>
