<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 425" width="940" height="425" role="img" aria-labelledby="title desc"><title id="title">Keep one source for separate derivatives</title><desc id="desc">Delivery A and Delivery B are encoded separately from the retained source. A next conversion made from Delivery A can add another lossy generation. The illustration makes no claim about the amount of visible loss.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526879"/></marker></defs><rect width="940" height="425" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="38" font-size="24" text-anchor="start" fill="#17354a">Keep one source for separate derivatives</text><rect x="32" y="157" width="240" height="116" rx="8" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="152" y="208" font-size="20" text-anchor="middle" fill="#17354a">Retained source</text><text x="152" y="236" font-size="20" text-anchor="middle" fill="#17354a">Start each derivative here</text><path d="M280 189L321 189L321 125L354 125" fill="none" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M280 245L321 245L321 303L354 303" fill="none" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="362" y="80" width="214" height="90" rx="8" fill="#dcf1e2" stroke="#8da6b6" stroke-width="2"/><text x="469" y="132" font-size="20" text-anchor="middle" fill="#17354a">Delivery A</text><rect x="362" y="258" width="214" height="90" rx="8" fill="#dcf1e2" stroke="#8da6b6" stroke-width="2"/><text x="469" y="310" font-size="20" text-anchor="middle" fill="#17354a">Delivery B</text><line x1="584" y1="125" x2="684" y2="125" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><text x="634" y="98" font-size="16" text-anchor="middle" fill="#17354a">Encode again</text><rect x="692" y="80" width="216" height="90" rx="8" fill="#fae7cb" stroke="#8da6b6" stroke-width="2"/><text x="800" y="118" font-size="20" text-anchor="middle" fill="#17354a">Next conversion</text><text x="800" y="146" font-size="20" text-anchor="middle" fill="#17354a">from Delivery A</text><text x="753" y="223" font-size="18" text-anchor="middle" fill="#17354a">An additional lossy</text><text x="753" y="250" font-size="18" text-anchor="middle" fill="#17354a">generation can occur</text><text x="470" y="395" font-size="19" text-anchor="middle" fill="#17354a">Separate derivatives avoid using a reduced delivery copy as the next source</text></g></svg>
