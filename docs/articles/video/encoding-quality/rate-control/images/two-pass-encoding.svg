<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 364" width="940" height="364" role="img" aria-labelledby="title desc"><title id="title">Whole-source two-pass encoding</title><desc id="desc">Pass one analyzes the source and writes statistics. Pass two reads the same source again and uses the statistics to guide the final encode. The second pass does not encode the first pass compressed pictures.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526879"/></marker></defs><rect width="940" height="364" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="38" font-size="24" text-anchor="start" fill="#17354a">Whole-source two-pass encoding</text><text x="32" y="76" font-size="18" text-anchor="start" fill="#17354a">Pass 1: analyze</text><rect x="32" y="88" width="218" height="75" rx="8" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="141" y="132.5" font-size="20" text-anchor="middle" fill="#17354a">Source</text><line x1="258" y1="125" x2="352" y2="125" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="360" y="88" width="220" height="75" rx="8" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="470" y="132.5" font-size="20" text-anchor="middle" fill="#17354a">Analysis</text><line x1="588" y1="125" x2="682" y2="125" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="690" y="88" width="218" height="75" rx="8" fill="#e9e1f3" stroke="#8da6b6" stroke-width="2"/><text x="799" y="132.5" font-size="20" text-anchor="middle" fill="#17354a">Statistics</text><path d="M799 172L799 204L470 204L470 249" fill="none" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><text x="591" y="192" font-size="17" text-anchor="middle" fill="#17354a">Guide allocation</text><text x="32" y="242" font-size="18" text-anchor="start" fill="#17354a">Pass 2: encode</text><rect x="32" y="254" width="218" height="75" rx="8" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="141" y="298.5" font-size="20" text-anchor="middle" fill="#17354a">Same source</text><line x1="258" y1="291" x2="352" y2="291" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="360" y="254" width="220" height="75" rx="8" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="470" y="298.5" font-size="20" text-anchor="middle" fill="#17354a">Final encode</text><line x1="588" y1="291" x2="682" y2="291" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="690" y="254" width="218" height="75" rx="8" fill="#dcf1e2" stroke="#8da6b6" stroke-width="2"/><text x="799" y="298.5" font-size="20" text-anchor="middle" fill="#17354a">Final video</text></g></svg>
