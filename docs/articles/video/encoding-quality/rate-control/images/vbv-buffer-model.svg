<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" width="940" height="345" role="img" aria-labelledby="title desc"><title id="title">A modeled decoder buffer</title><desc id="desc">Data arrives at an illustrative 4 megabits per second into a buffer with an illustrative capacity of 16 megabits. Pictures remove varying amounts at their required decoding times. No specific occupancy or conformance result is asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526879"/></marker></defs><rect width="940" height="345" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="38" font-size="24" text-anchor="start" fill="#17354a">A modeled decoder buffer</text><rect x="32" y="114" width="236" height="112" rx="8" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="150" y="163" font-size="20" text-anchor="middle" fill="#17354a">Data arrival</text><text x="150" y="191" font-size="20" text-anchor="middle" fill="#17354a">Example: 4 Mb/s</text><line x1="276" y1="170" x2="354" y2="170" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="362" y="81" width="216" height="191" rx="8" fill="#ffffff" stroke="#8da6b6" stroke-width="2"/><text x="470" y="117" font-size="20" text-anchor="middle" fill="#17354a">Buffer capacity</text><text x="470" y="148" font-size="20" text-anchor="middle" fill="#17354a">16 megabits</text><rect x="377" y="174" width="186" height="81" rx="4" fill="#e9e1f3"/><text x="470" y="220" font-size="20" text-anchor="middle" fill="#17354a">Occupancy</text><line x1="586" y1="170" x2="664" y2="170" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="672" y="114" width="236" height="112" rx="8" fill="#dcf1e2" stroke="#8da6b6" stroke-width="2"/><text x="790" y="163" font-size="20" text-anchor="middle" fill="#17354a">Picture removal</text><text x="790" y="191" font-size="20" text-anchor="middle" fill="#17354a">Different byte sizes</text><text x="470" y="315" font-size="20" text-anchor="middle" fill="#17354a">Arrival, occupancy, and removal timing must work together</text></g></svg>
