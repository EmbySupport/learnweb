<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="title desc"><title id="title">Frame-based Motion JPEG</title><desc id="desc">Pictures A, B, and C each become their own JPEG-compressed picture. No picture uses a prediction from a neighboring picture.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526879"/></marker></defs><rect width="940" height="378" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="38" font-size="24" text-anchor="start" fill="#17354a">Frame-based Motion JPEG</text><rect x="58" y="91" width="210" height="75" rx="8" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="163" y="135.5" font-size="20" text-anchor="middle" fill="#17354a">Picture A</text><line x1="163" y1="171" x2="163" y2="220" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="58" y="228" width="210" height="80" rx="8" fill="#dcf1e2" stroke="#8da6b6" stroke-width="2"/><text x="163" y="275" font-size="20" text-anchor="middle" fill="#17354a">JPEG picture A</text><rect x="365" y="91" width="210" height="75" rx="8" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="470" y="135.5" font-size="20" text-anchor="middle" fill="#17354a">Picture B</text><line x1="470" y1="171" x2="470" y2="220" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="365" y="228" width="210" height="80" rx="8" fill="#dcf1e2" stroke="#8da6b6" stroke-width="2"/><text x="470" y="275" font-size="20" text-anchor="middle" fill="#17354a">JPEG picture B</text><rect x="672" y="91" width="210" height="75" rx="8" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="777" y="135.5" font-size="20" text-anchor="middle" fill="#17354a">Picture C</text><line x1="777" y1="171" x2="777" y2="220" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="672" y="228" width="210" height="80" rx="8" fill="#dcf1e2" stroke="#8da6b6" stroke-width="2"/><text x="777" y="275" font-size="20" text-anchor="middle" fill="#17354a">JPEG picture C</text><text x="470" y="350" font-size="20" text-anchor="middle" fill="#17354a">No prediction from neighboring pictures</text></g></svg>
