<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-labelledby="title desc"><title id="title">FFV1 preserves its input sample values</title><desc id="desc">Illustrative sample values 12, 23, 31, and 44 enter an FFV1 encode/decode round trip and emerge unchanged. Any previous conversion lies before this codec boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526879"/></marker></defs><rect width="940" height="340" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="38" font-size="24" text-anchor="start" fill="#17354a">FFV1 preserves its input sample values</text><rect x="32" y="95" width="235" height="128" rx="8" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="149.5" y="152" font-size="20" text-anchor="middle" fill="#17354a">Codec input samples</text><text x="149.5" y="180" font-size="20" text-anchor="middle" fill="#17354a">12, 23, 31, 44</text><line x1="275" y1="159" x2="324" y2="159" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="332" y="95" width="276" height="128" rx="8" fill="#e9e1f3" stroke="#8da6b6" stroke-width="2"/><text x="470" y="152" font-size="20" text-anchor="middle" fill="#17354a">FFV1 round trip</text><text x="470" y="180" font-size="20" text-anchor="middle" fill="#17354a">Encode → decode</text><line x1="616" y1="159" x2="665" y2="159" stroke="#526879" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="673" y="95" width="235" height="128" rx="8" fill="#dcf1e2" stroke="#8da6b6" stroke-width="2"/><text x="790.5" y="152" font-size="20" text-anchor="middle" fill="#17354a">Codec output samples</text><text x="790.5" y="180" font-size="20" text-anchor="middle" fill="#17354a">12, 23, 31, 44</text><text x="470" y="275" font-size="19" text-anchor="middle" fill="#17354a">Exact values at the codec boundary, using the same sample format</text><text x="470" y="310" font-size="18" text-anchor="middle" fill="#526879">Earlier conversion losses cannot be undone</text></g></svg>
