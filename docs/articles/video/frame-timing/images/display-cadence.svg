<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 315" width="920" height="315" role="img" aria-labelledby="title desc"><title id="title">Display refresh cadence</title><desc id="desc">Four film pictures A B C D are held across ten display refresh intervals as A A B B B C C D D D.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526879"/></marker></defs><rect width="920" height="315" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="35" font-size="24" text-anchor="start" fill="#17354a">24 fps film on a 60 Hz display</text><text x="32" y="66" font-size="18" text-anchor="start" fill="#17354a">One box = one refresh interval, about 16.67 ms</text><rect x="102" y="107" width="70" height="72" rx="6" fill="#dcf1e2" stroke="#8da6b6" stroke-width="2"/><text x="137" y="152" font-size="27" text-anchor="middle" fill="#17354a">A</text><text x="137" y="207" font-size="17" text-anchor="middle" fill="#17354a">1</text><rect x="178" y="107" width="70" height="72" rx="6" fill="#dcf1e2" stroke="#8da6b6" stroke-width="2"/><text x="213" y="152" font-size="27" text-anchor="middle" fill="#17354a">A</text><text x="213" y="207" font-size="17" text-anchor="middle" fill="#17354a">2</text><rect x="254" y="107" width="70" height="72" rx="6" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="289" y="152" font-size="27" text-anchor="middle" fill="#17354a">B</text><text x="289" y="207" font-size="17" text-anchor="middle" fill="#17354a">3</text><rect x="330" y="107" width="70" height="72" rx="6" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="365" y="152" font-size="27" text-anchor="middle" fill="#17354a">B</text><text x="365" y="207" font-size="17" text-anchor="middle" fill="#17354a">4</text><rect x="406" y="107" width="70" height="72" rx="6" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="441" y="152" font-size="27" text-anchor="middle" fill="#17354a">B</text><text x="441" y="207" font-size="17" text-anchor="middle" fill="#17354a">5</text><rect x="482" y="107" width="70" height="72" rx="6" fill="#fae7cb" stroke="#8da6b6" stroke-width="2"/><text x="517" y="152" font-size="27" text-anchor="middle" fill="#17354a">C</text><text x="517" y="207" font-size="17" text-anchor="middle" fill="#17354a">6</text><rect x="558" y="107" width="70" height="72" rx="6" fill="#fae7cb" stroke="#8da6b6" stroke-width="2"/><text x="593" y="152" font-size="27" text-anchor="middle" fill="#17354a">C</text><text x="593" y="207" font-size="17" text-anchor="middle" fill="#17354a">7</text><rect x="634" y="107" width="70" height="72" rx="6" fill="#e5e0f8" stroke="#8da6b6" stroke-width="2"/><text x="669" y="152" font-size="27" text-anchor="middle" fill="#17354a">D</text><text x="669" y="207" font-size="17" text-anchor="middle" fill="#17354a">8</text><rect x="710" y="107" width="70" height="72" rx="6" fill="#e5e0f8" stroke="#8da6b6" stroke-width="2"/><text x="745" y="152" font-size="27" text-anchor="middle" fill="#17354a">D</text><text x="745" y="207" font-size="17" text-anchor="middle" fill="#17354a">9</text><rect x="786" y="107" width="70" height="72" rx="6" fill="#e5e0f8" stroke="#8da6b6" stroke-width="2"/><text x="821" y="152" font-size="27" text-anchor="middle" fill="#17354a">D</text><text x="821" y="207" font-size="17" text-anchor="middle" fill="#17354a">10</text><text x="475" y="247" font-size="20" text-anchor="middle" fill="#17354a">A: 2 refreshes   •   B: 3   •   C: 2   •   D: 3</text><text x="475" y="282" font-size="18" text-anchor="middle" fill="#17354a">Repeated display holds; no additional captured motion</text></g></svg>
