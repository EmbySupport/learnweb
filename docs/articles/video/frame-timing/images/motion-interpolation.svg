<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 343" width="940" height="343" role="img" aria-labelledby="title desc"><title id="title">Motion interpolation estimates additional pictures</title><desc id="desc">Two recorded ball positions appear at left and right. A dashed estimated position is created between them.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526879"/></marker></defs><rect width="940" height="343" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="35" font-size="24" text-anchor="start" fill="#17354a">Recorded pictures surround an estimated picture</text><rect x="35" y="78" width="245" height="151" rx="6" fill="#ffffff" stroke="#a3b8c7" stroke-width="2"/><circle cx="85" cy="154" r="23" fill="#52b54b" stroke="#52b54b" stroke-width="3"/><text x="157.5" y="265" font-size="20" text-anchor="middle" fill="#17354a">Recorded t₀</text><line x1="289" y1="154" x2="329" y2="154" stroke="#526879" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="78" width="245" height="151" rx="6" fill="#ffffff" stroke="#d27130" stroke-width="2"/><circle cx="463" cy="154" r="23" fill="#fae7cb" stroke="#d27130" stroke-width="3" stroke-dasharray="6 4"/><text x="462.5" y="265" font-size="20" text-anchor="middle" fill="#17354a">Estimated middle</text><line x1="594" y1="154" x2="634" y2="154" stroke="#526879" stroke-width="2" marker-end="url(#arrow)"/><rect x="645" y="78" width="245" height="151" rx="6" fill="#ffffff" stroke="#a3b8c7" stroke-width="2"/><circle cx="841" cy="154" r="23" fill="#52b54b" stroke="#52b54b" stroke-width="3"/><text x="767.5" y="265" font-size="20" text-anchor="middle" fill="#17354a">Recorded t₁</text><text x="460" y="312" font-size="18" text-anchor="middle" fill="#17354a">The middle position is an estimate, not a camera exposure</text></g></svg>
