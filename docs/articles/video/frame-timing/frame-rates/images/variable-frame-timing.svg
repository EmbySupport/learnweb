<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 288" width="900" height="288" role="img" aria-labelledby="title desc"><title id="title">Constant and variable frame timing</title><desc id="desc">Constant frame starts are 0, 40, 80, and 120 milliseconds. Variable example starts are 0, 40, 60, and 120 milliseconds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526879"/></marker></defs><rect width="900" height="288" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="35" font-size="24" text-anchor="start" fill="#17354a">Picture start times on one timeline</text><text x="28" y="111" font-size="19" text-anchor="start" fill="#17354a">Constant rate</text><line x1="195" y1="95" x2="195" y2="115" stroke="#bccbd6" stroke-width="1"/><line x1="295" y1="95" x2="295" y2="115" stroke="#bccbd6" stroke-width="1"/><line x1="395" y1="95" x2="395" y2="115" stroke="#bccbd6" stroke-width="1"/><line x1="495" y1="95" x2="495" y2="115" stroke="#bccbd6" stroke-width="1"/><line x1="595" y1="95" x2="595" y2="115" stroke="#bccbd6" stroke-width="1"/><line x1="695" y1="95" x2="695" y2="115" stroke="#bccbd6" stroke-width="1"/><line x1="795" y1="95" x2="795" y2="115" stroke="#bccbd6" stroke-width="1"/><line x1="190" y1="105" x2="830" y2="105" stroke="#526879" stroke-width="2" marker-end="url(#arrow)"/><circle cx="195" cy="105" r="8" fill="#3094c8"/><text x="195" y="83" font-size="18" text-anchor="middle" fill="#17354a">A</text><text x="195" y="139" font-size="16" text-anchor="middle" fill="#17354a">0 ms</text><circle cx="395" cy="105" r="8" fill="#3094c8"/><text x="395" y="83" font-size="18" text-anchor="middle" fill="#17354a">B</text><text x="395" y="139" font-size="16" text-anchor="middle" fill="#17354a">40 ms</text><circle cx="595" cy="105" r="8" fill="#3094c8"/><text x="595" y="83" font-size="18" text-anchor="middle" fill="#17354a">C</text><text x="595" y="139" font-size="16" text-anchor="middle" fill="#17354a">80 ms</text><circle cx="795" cy="105" r="8" fill="#3094c8"/><text x="795" y="83" font-size="18" text-anchor="middle" fill="#17354a">D</text><text x="795" y="139" font-size="16" text-anchor="middle" fill="#17354a">120 ms</text><text x="28" y="226" font-size="19" text-anchor="start" fill="#17354a">Variable rate</text><line x1="195" y1="210" x2="195" y2="230" stroke="#bccbd6" stroke-width="1"/><line x1="295" y1="210" x2="295" y2="230" stroke="#bccbd6" stroke-width="1"/><line x1="395" y1="210" x2="395" y2="230" stroke="#bccbd6" stroke-width="1"/><line x1="495" y1="210" x2="495" y2="230" stroke="#bccbd6" stroke-width="1"/><line x1="595" y1="210" x2="595" y2="230" stroke="#bccbd6" stroke-width="1"/><line x1="695" y1="210" x2="695" y2="230" stroke="#bccbd6" stroke-width="1"/><line x1="795" y1="210" x2="795" y2="230" stroke="#bccbd6" stroke-width="1"/><line x1="190" y1="220" x2="830" y2="220" stroke="#526879" stroke-width="2" marker-end="url(#arrow)"/><circle cx="195" cy="220" r="8" fill="#52b54b"/><text x="195" y="198" font-size="18" text-anchor="middle" fill="#17354a">A</text><text x="195" y="254" font-size="16" text-anchor="middle" fill="#17354a">0 ms</text><circle cx="395" cy="220" r="8" fill="#52b54b"/><text x="395" y="198" font-size="18" text-anchor="middle" fill="#17354a">B</text><text x="395" y="254" font-size="16" text-anchor="middle" fill="#17354a">40 ms</text><circle cx="495" cy="220" r="8" fill="#52b54b"/><text x="495" y="198" font-size="18" text-anchor="middle" fill="#17354a">C</text><text x="495" y="254" font-size="16" text-anchor="middle" fill="#17354a">60 ms</text><circle cx="795" cy="220" r="8" fill="#52b54b"/><text x="795" y="198" font-size="18" text-anchor="middle" fill="#17354a">D</text><text x="795" y="254" font-size="16" text-anchor="middle" fill="#17354a">120 ms</text></g></svg>
