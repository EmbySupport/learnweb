<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 359" width="950" height="359" role="img" aria-labelledby="title desc"><title id="title">Correct and reversed field order</title><desc id="desc">Steady movement is presented as capture times 0, 20, 40, 60 milliseconds in the correct order. Reversed pairs present 20, 0, 60, 40 milliseconds, making the object step backwards twice.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526879"/></marker></defs><rect width="950" height="359" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="35" font-size="24" text-anchor="start" fill="#17354a">Field order controls the motion sequence</text><text x="28" y="123" font-size="20" text-anchor="start" fill="#17354a">Correct TFF</text><rect x="210" y="85" width="145" height="65" rx="6" fill="#ffffff" stroke="#a3b8c7" stroke-width="2"/><line x1="225" y1="130" x2="340" y2="130" stroke="#e4ebf1" stroke-width="2"/><circle cx="238" cy="115" r="11" fill="#52b54b"/><text x="282.5" y="181" font-size="19" text-anchor="middle" fill="#17354a">0 ms</text><line x1="363" y1="117" x2="384" y2="117" stroke="#526879" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="85" width="145" height="65" rx="6" fill="#ffffff" stroke="#a3b8c7" stroke-width="2"/><line x1="405" y1="130" x2="520" y2="130" stroke="#e4ebf1" stroke-width="2"/><circle cx="445" cy="115" r="11" fill="#52b54b"/><text x="462.5" y="181" font-size="19" text-anchor="middle" fill="#17354a">20 ms</text><line x1="543" y1="117" x2="564" y2="117" stroke="#526879" stroke-width="2" marker-end="url(#arrow)"/><rect x="570" y="85" width="145" height="65" rx="6" fill="#ffffff" stroke="#a3b8c7" stroke-width="2"/><line x1="585" y1="130" x2="700" y2="130" stroke="#e4ebf1" stroke-width="2"/><circle cx="652" cy="115" r="11" fill="#52b54b"/><text x="642.5" y="181" font-size="19" text-anchor="middle" fill="#17354a">40 ms</text><line x1="723" y1="117" x2="744" y2="117" stroke="#526879" stroke-width="2" marker-end="url(#arrow)"/><rect x="750" y="85" width="145" height="65" rx="6" fill="#ffffff" stroke="#a3b8c7" stroke-width="2"/><line x1="765" y1="130" x2="880" y2="130" stroke="#e4ebf1" stroke-width="2"/><circle cx="859" cy="115" r="11" fill="#52b54b"/><text x="822.5" y="181" font-size="19" text-anchor="middle" fill="#17354a">60 ms</text><text x="28" y="263" font-size="20" text-anchor="start" fill="#17354a">Pairs reversed</text><rect x="210" y="225" width="145" height="65" rx="6" fill="#ffffff" stroke="#a3b8c7" stroke-width="2"/><line x1="225" y1="270" x2="340" y2="270" stroke="#e4ebf1" stroke-width="2"/><circle cx="265" cy="255" r="11" fill="#d27130"/><text x="282.5" y="321" font-size="19" text-anchor="middle" fill="#17354a">20 ms</text><line x1="363" y1="257" x2="384" y2="257" stroke="#526879" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="225" width="145" height="65" rx="6" fill="#ffffff" stroke="#a3b8c7" stroke-width="2"/><line x1="405" y1="270" x2="520" y2="270" stroke="#e4ebf1" stroke-width="2"/><circle cx="418" cy="255" r="11" fill="#d27130"/><text x="462.5" y="321" font-size="19" text-anchor="middle" fill="#17354a">0 ms</text><line x1="543" y1="257" x2="564" y2="257" stroke="#526879" stroke-width="2" marker-end="url(#arrow)"/><rect x="570" y="225" width="145" height="65" rx="6" fill="#ffffff" stroke="#a3b8c7" stroke-width="2"/><line x1="585" y1="270" x2="700" y2="270" stroke="#e4ebf1" stroke-width="2"/><circle cx="679" cy="255" r="11" fill="#d27130"/><text x="642.5" y="321" font-size="19" text-anchor="middle" fill="#17354a">60 ms</text><line x1="723" y1="257" x2="744" y2="257" stroke="#526879" stroke-width="2" marker-end="url(#arrow)"/><rect x="750" y="225" width="145" height="65" rx="6" fill="#ffffff" stroke="#a3b8c7" stroke-width="2"/><line x1="765" y1="270" x2="880" y2="270" stroke="#e4ebf1" stroke-width="2"/><circle cx="832" cy="255" r="11" fill="#d27130"/><text x="822.5" y="321" font-size="19" text-anchor="middle" fill="#17354a">40 ms</text></g></svg>
