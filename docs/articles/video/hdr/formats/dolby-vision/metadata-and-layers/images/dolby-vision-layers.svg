<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" role="img" aria-labelledby="title desc"><title id="title">Single-layer and dual-layer Dolby Vision</title><desc id="desc">Single-layer delivery provides a base picture and metadata. Dual-layer delivery combines a base picture with enhancement information before display management. Metadata guides the processing in both cases.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b9cf"/></marker></defs><rect width="940" height="380" rx="12" fill="#152132"/><g font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#f4f7fb"><text x="28" y="35" font-size="23" font-weight="600">Dolby Vision: pictures and metadata</text><text x="28" y="74" fill="#c0ccdb">Single-layer delivery</text><text x="28" y="225" fill="#c0ccdb">Dual-layer delivery</text><g fill="#213b54" stroke="#65b9db" stroke-width="1.5"><rect x="28" y="92" width="175" height="54" rx="8"/><rect x="28" y="243" width="175" height="54" rx="8"/><rect x="257" y="243" width="184" height="54" rx="8"/><rect x="506" y="243" width="160" height="54" rx="8"/><rect x="731" y="243" width="181" height="54" rx="8"/><rect x="506" y="92" width="160" height="54" rx="8"/><rect x="731" y="92" width="181" height="54" rx="8"/></g><text x="116" y="125" text-anchor="middle">Base picture</text><text x="116" y="276" text-anchor="middle">Base picture</text><text x="349" y="267" text-anchor="middle">Combine with</text><text x="349" y="287" text-anchor="middle">enhancement</text><text x="586" y="115" text-anchor="middle">Display</text><text x="586" y="135" text-anchor="middle">management</text><text x="586" y="267" text-anchor="middle">Display</text><text x="586" y="287" text-anchor="middle">management</text><text x="821" y="125" text-anchor="middle">Adapted picture</text><text x="821" y="276" text-anchor="middle">Adapted picture</text><text x="455" y="175" text-anchor="middle" fill="#e7c578">Metadata guides processing</text><text x="390" y="344" fill="#e7c578">Metadata guides reconstruction and display management</text></g><g stroke="#a7b9cf" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M 203 119 H 498"/><path d="M 666 119 H 722"/><path d="M 203 270 H 249"/><path d="M 441 270 H 498"/><path d="M 666 270 H 722"/></g></svg>