<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 368" width="900" height="368" role="img" aria-labelledby="title desc"><title id="title">Display aspect ratios</title><desc id="desc">A 4:3 rectangle and a 16:9 rectangle are drawn at the same height.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526879"/></marker></defs><rect width="900" height="368" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="35" font-size="24" text-anchor="start" fill="#17354a">Display proportions at the same height</text><rect x="50" y="78" width="288" height="216" rx="6" fill="#e8f4fb" stroke="#3094c8" stroke-width="2"/><rect x="450" y="78" width="384" height="216" rx="6" fill="#dcf1e2" stroke="#52b54b" stroke-width="2"/><circle cx="194" cy="186" r="58" fill="#ffffff" opacity="0.8"/><circle cx="642" cy="186" r="58" fill="#ffffff" opacity="0.8"/><text x="194" y="335" font-size="22" text-anchor="middle" fill="#17354a">4:3   ≈ 1.33:1</text><text x="642" y="335" font-size="22" text-anchor="middle" fill="#17354a">16:9   ≈ 1.78:1</text></g></svg>
