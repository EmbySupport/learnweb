<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-labelledby="title desc"><title id="title">Anamorphic widescreen presentation</title><desc id="desc">A 4:3 stored grid is presented at 16:9. A squeezed oval becomes a circle when its intended pixel aspect ratio is applied.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526879"/></marker></defs><rect width="1000" height="410" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="35" font-size="24" text-anchor="start" fill="#17354a">Anamorphic storage and intended presentation</text><rect x="50" y="80" width="288" height="216" rx="6" fill="#e8f4fb" stroke="#3094c8" stroke-width="2"/><rect x="560" y="80" width="384" height="216" rx="6" fill="#dcf1e2" stroke="#52b54b" stroke-width="2"/><ellipse cx="194" cy="188" rx="43.5" ry="58" fill="#ffffff"/><circle cx="752" cy="188" r="58" fill="#ffffff"/><line x1="365" y1="184" x2="525" y2="184" stroke="#526879" stroke-width="2" marker-end="url(#arrow)"/><text x="445" y="159" font-size="19" text-anchor="middle" fill="#17354a">PAR 4:3</text><text x="194" y="334" font-size="22" text-anchor="middle" fill="#17354a">Stored: 1440 × 1080</text><text x="752" y="334" font-size="22" text-anchor="middle" fill="#17354a">Displayed shape: 16:9</text><text x="500" y="378" font-size="19" text-anchor="middle" fill="#17354a">Horizontal presentation expansion does not add captured detail</text></g></svg>
