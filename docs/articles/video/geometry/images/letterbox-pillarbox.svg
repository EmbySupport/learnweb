<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 373" width="940" height="373" role="img" aria-labelledby="title desc"><title id="title">Letterboxing and pillarboxing</title><desc id="desc">A 2.4:1 picture in a 16:9 screen has top and bottom bars. A 4:3 picture in a 16:9 screen has side bars.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526879"/></marker></defs><rect width="940" height="373" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="35" font-size="24" text-anchor="start" fill="#17354a">Bars preserve the complete picture</text><rect x="50" y="85" width="384" height="216" rx="0" fill="#15232c" stroke="#526879" stroke-width="2"/><rect x="50" y="113" width="384" height="160" rx="0" fill="#dcf1e2" stroke="#52b54b" stroke-width="2"/><circle cx="242" cy="193" r="48" fill="#ffffff" opacity="0.85"/><text x="242" y="340" font-size="22" text-anchor="middle" fill="#17354a">Letterboxing</text><rect x="500" y="85" width="384" height="216" rx="0" fill="#15232c" stroke="#526879" stroke-width="2"/><rect x="548" y="85" width="288" height="216" rx="0" fill="#dcf1e2" stroke="#52b54b" stroke-width="2"/><circle cx="692" cy="193" r="48" fill="#ffffff" opacity="0.85"/><text x="692" y="340" font-size="22" text-anchor="middle" fill="#17354a">Pillarboxing</text></g></svg>
