<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="title desc"><title id="title">GOP display and decode order</title><desc id="desc">Display order is I0 B1 B2 P3 B4 B5 P6. A valid decode order is I0 P3 B1 B2 P6 B4 B5. B1 and B2 depend on I0 and P3; B4 and B5 depend on P3 and P6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526879"/></marker></defs><rect width="940" height="404" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="35" font-size="24" text-anchor="start" fill="#17354a">One illustrative closed GOP</text><text x="32" y="66" font-size="18" text-anchor="start" fill="#17354a">Reference anchors are decoded before pictures that depend on them</text><text x="28" y="142" font-size="19" text-anchor="start" fill="#17354a">Display order</text><rect x="188" y="104" width="80" height="63" rx="6" fill="#dcf1e2" stroke="#8da6b6" stroke-width="2"/><text x="228" y="144" font-size="23" text-anchor="middle" fill="#17354a">I0</text><line x1="271" y1="135" x2="281" y2="135" stroke="#526879" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="286" y="104" width="80" height="63" rx="6" fill="#fae7cb" stroke="#8da6b6" stroke-width="2"/><text x="326" y="144" font-size="23" text-anchor="middle" fill="#17354a">B1</text><line x1="369" y1="135" x2="379" y2="135" stroke="#526879" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="384" y="104" width="80" height="63" rx="6" fill="#fae7cb" stroke="#8da6b6" stroke-width="2"/><text x="424" y="144" font-size="23" text-anchor="middle" fill="#17354a">B2</text><line x1="467" y1="135" x2="477" y2="135" stroke="#526879" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="482" y="104" width="80" height="63" rx="6" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="522" y="144" font-size="23" text-anchor="middle" fill="#17354a">P3</text><line x1="565" y1="135" x2="575" y2="135" stroke="#526879" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="580" y="104" width="80" height="63" rx="6" fill="#fae7cb" stroke="#8da6b6" stroke-width="2"/><text x="620" y="144" font-size="23" text-anchor="middle" fill="#17354a">B4</text><line x1="663" y1="135" x2="673" y2="135" stroke="#526879" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="678" y="104" width="80" height="63" rx="6" fill="#fae7cb" stroke="#8da6b6" stroke-width="2"/><text x="718" y="144" font-size="23" text-anchor="middle" fill="#17354a">B5</text><line x1="761" y1="135" x2="771" y2="135" stroke="#526879" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="776" y="104" width="80" height="63" rx="6" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="816" y="144" font-size="23" text-anchor="middle" fill="#17354a">P6</text><text x="28" y="269" font-size="19" text-anchor="start" fill="#17354a">Decode order</text><rect x="188" y="231" width="80" height="63" rx="6" fill="#dcf1e2" stroke="#8da6b6" stroke-width="2"/><text x="228" y="271" font-size="23" text-anchor="middle" fill="#17354a">I0</text><line x1="271" y1="262" x2="281" y2="262" stroke="#526879" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="286" y="231" width="80" height="63" rx="6" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="326" y="271" font-size="23" text-anchor="middle" fill="#17354a">P3</text><line x1="369" y1="262" x2="379" y2="262" stroke="#526879" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="384" y="231" width="80" height="63" rx="6" fill="#fae7cb" stroke="#8da6b6" stroke-width="2"/><text x="424" y="271" font-size="23" text-anchor="middle" fill="#17354a">B1</text><line x1="467" y1="262" x2="477" y2="262" stroke="#526879" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="482" y="231" width="80" height="63" rx="6" fill="#fae7cb" stroke="#8da6b6" stroke-width="2"/><text x="522" y="271" font-size="23" text-anchor="middle" fill="#17354a">B2</text><line x1="565" y1="262" x2="575" y2="262" stroke="#526879" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="580" y="231" width="80" height="63" rx="6" fill="#dbeefa" stroke="#8da6b6" stroke-width="2"/><text x="620" y="271" font-size="23" text-anchor="middle" fill="#17354a">P6</text><line x1="663" y1="262" x2="673" y2="262" stroke="#526879" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="678" y="231" width="80" height="63" rx="6" fill="#fae7cb" stroke="#8da6b6" stroke-width="2"/><text x="718" y="271" font-size="23" text-anchor="middle" fill="#17354a">B4</text><line x1="761" y1="262" x2="771" y2="262" stroke="#526879" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="776" y="231" width="80" height="63" rx="6" fill="#fae7cb" stroke="#8da6b6" stroke-width="2"/><text x="816" y="271" font-size="23" text-anchor="middle" fill="#17354a">B5</text><text x="470" y="340" font-size="19" text-anchor="middle" fill="#17354a">I0 + P3 → B1 / B2       •       P3 + P6 → B4 / B5</text><text x="470" y="374" font-size="17" text-anchor="middle" fill="#17354a">The B-pictures are not references in this example</text></g></svg>
