<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 382" width="950" height="382" role="img" aria-labelledby="title desc"><title id="title">Inter-frame prediction and residual</title><desc id="desc">A region from a reference picture is shifted using motion information. The predicted samples plus a residual produce the reconstructed picture.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526879"/></marker></defs><rect width="950" height="382" rx="12" fill="#f7fafc"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17354a"><text x="32" y="35" font-size="24" text-anchor="start" fill="#17354a">Prediction reuses an existing picture</text><rect x="50" y="76" width="280" height="130" rx="6" fill="#ffffff" stroke="#a3b8c7" stroke-width="2"/><rect x="580" y="76" width="280" height="130" rx="6" fill="#ffffff" stroke="#a3b8c7" stroke-width="2"/><line x1="85" y1="76" x2="85" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="120" y1="76" x2="120" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="155" y1="76" x2="155" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="190" y1="76" x2="190" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="225" y1="76" x2="225" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="260" y1="76" x2="260" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="295" y1="76" x2="295" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="50" y1="108.5" x2="330" y2="108.5" stroke="#e4ebf1" stroke-width="1"/><line x1="50" y1="141" x2="330" y2="141" stroke="#e4ebf1" stroke-width="1"/><line x1="50" y1="173.5" x2="330" y2="173.5" stroke="#e4ebf1" stroke-width="1"/><rect x="105" y="114" width="66" height="53" rx="0" fill="#dcf1e2" stroke="#52b54b" stroke-width="2"/><line x1="615" y1="76" x2="615" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="650" y1="76" x2="650" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="685" y1="76" x2="685" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="720" y1="76" x2="720" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="755" y1="76" x2="755" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="790" y1="76" x2="790" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="825" y1="76" x2="825" y2="206" stroke="#e4ebf1" stroke-width="1"/><line x1="580" y1="108.5" x2="860" y2="108.5" stroke="#e4ebf1" stroke-width="1"/><line x1="580" y1="141" x2="860" y2="141" stroke="#e4ebf1" stroke-width="1"/><line x1="580" y1="173.5" x2="860" y2="173.5" stroke="#e4ebf1" stroke-width="1"/><rect x="675" y="114" width="66" height="53" rx="0" fill="#dcf1e2" stroke="#52b54b" stroke-width="2"/><line x1="356" y1="138" x2="548" y2="138" stroke="#526879" stroke-width="2" marker-end="url(#arrow)"/><text x="452" y="113" font-size="19" text-anchor="middle" fill="#17354a">Motion information</text><text x="190" y="241" font-size="20" text-anchor="middle" fill="#17354a">Reference picture</text><text x="720" y="241" font-size="20" text-anchor="middle" fill="#17354a">Predicted region</text><rect x="58" y="285" width="220" height="63" rx="6" fill="#dcf1e2" stroke="#52b54b" stroke-width="2"/><text x="168" y="324" font-size="21" text-anchor="middle" fill="#17354a">Prediction</text><text x="310" y="325" font-size="26" text-anchor="middle" fill="#17354a">+</text><rect x="350" y="285" width="220" height="63" rx="6" fill="#dbeefa" stroke="#3094c8" stroke-width="2"/><text x="460" y="324" font-size="20" text-anchor="middle" fill="#17354a">Residual correction</text><text x="603" y="325" font-size="26" text-anchor="middle" fill="#17354a">=</text><rect x="645" y="285" width="270" height="63" rx="6" fill="#ffffff" stroke="#8da6b6" stroke-width="2"/><text x="780" y="324" font-size="20" text-anchor="middle" fill="#17354a">Reconstructed picture</text></g></svg>
