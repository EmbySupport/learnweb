<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 340" role="img" aria-labelledby="title desc"><title id="title">Scene light to display light</title><desc id="desc">An OETF maps scene light to a signal. An EOTF maps the signal to display light. An OOTF describes the overall relationship.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#59666f" stroke-width="1.4"/></marker></defs><rect width="1160" height="340" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#27323a"><rect x="30" y="55" width="230" height="95" rx="12" fill="#eaf3e8" stroke="#659b53"/><text x="145" y="110" font-size="26">Scene light</text><rect x="465" y="55" width="230" height="95" rx="12" fill="#eef2f4" stroke="#8093a2"/><text x="580" y="110" font-size="26">Encoded signal</text><rect x="900" y="55" width="230" height="95" rx="12" fill="#eaf3e8" stroke="#659b53"/><text x="1015" y="110" font-size="26">Display light</text><text x="362" y="82" font-size="25" font-weight="600">OETF</text><text x="797" y="82" font-size="25" font-weight="600">EOTF</text><text x="580" y="292" font-size="27" font-weight="600">OOTF: overall scene-to-display relationship</text></g><g fill="none" stroke="#59666f" stroke-width="3" marker-end="url(#arrow)"><path d="M275 111 H448"/><path d="M710 111 H883"/><path d="M145 168 V225 H1015 V168"/></g></svg>