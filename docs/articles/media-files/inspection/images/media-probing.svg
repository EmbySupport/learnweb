<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340" role="img" aria-labelledby="title desc"><title id="title">Media probing</title><desc id="desc">A probe reads container descriptions and media data as needed, then reports technical properties. A summary probe does not test every frame.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7b9cf"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f7fb;font-size:19px}.title{font-size:25px;font-weight:600}.muted{fill:#c0ccdb}.label{font-size:17px}.accent{fill:#e7c578}</style><rect width="940" height="340" rx="12" fill="#152132"/><text x="28" y="38" class="title" text-anchor="start">Probing turns media structure into useful properties</text><rect x="28" y="96" width="233" height="71" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="144" y="139" text-anchor="middle">Container descriptions</text><rect x="28" y="209" width="233" height="71" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="144" y="252" text-anchor="middle">Encoded media data</text><rect x="341" y="124" width="207" height="126" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="444" y="160" text-anchor="middle">Probe</text><text x="444" y="199" class="muted label" text-anchor="middle">Read and inspect</text><text x="444" y="228" class="muted label" text-anchor="middle">as needed</text><rect x="629" y="82" width="282" height="199" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="770" y="123" text-anchor="middle">Technical information</text><text x="770" y="166" class="muted label" text-anchor="middle">Container and codecs</text><text x="770" y="203" class="muted label" text-anchor="middle">Tracks and properties</text><text x="770" y="240" class="muted label" text-anchor="middle">Duration and timing</text><path d="M267 131H300V187H335" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M267 244H300V187" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M554 187H623" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><text x="470" y="320" class="muted label" text-anchor="middle">A summary identifies properties; it does not test every frame.</text></svg>