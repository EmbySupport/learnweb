<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340" role="img" aria-labelledby="title desc"><title id="title">A STRM pointer and its media source</title><desc id="desc">A library item has a STRM text file containing a media address. The address points to the actual picture and sound, which remain a separate resource.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7b9cf"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f7fb;font-size:19px}.title{font-size:25px;font-weight:600}.muted{fill:#c0ccdb}.label{font-size:17px}.accent{fill:#e7c578}</style><rect width="940" height="340" rx="12" fill="#152132"/><text x="28" y="38" class="title" text-anchor="start">A STRM file points to the media</text><rect x="28" y="106" width="247" height="127" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="151" y="144" text-anchor="middle">Library item</text><text x="151" y="184" class="muted label" text-anchor="middle">Title, poster, description</text><rect x="346" y="106" width="226" height="127" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="459" y="144" text-anchor="middle">STRM text file</text><text x="459" y="184" class="muted label" text-anchor="middle">Media URL or path</text><rect x="643" y="106" width="269" height="127" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="777" y="144" text-anchor="middle">Actual media</text><text x="777" y="184" class="muted label" text-anchor="middle">Picture and sound</text><path d="M281 169H340" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M578 169H637" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><text x="470" y="293" class="muted label" text-anchor="middle">Saving the pointer does not save the referenced recording.</text></svg>