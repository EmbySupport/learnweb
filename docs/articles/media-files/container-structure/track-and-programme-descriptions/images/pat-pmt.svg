<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340" role="img" aria-labelledby="title desc"><title id="title">MPEG transport-stream programme tables</title><desc id="desc">The PAT on PID zero maps example programme seven to a PMT on PID hexadecimal 0100. Its PMT describes video on PID 0101 and audio on PID 0102, with the clock reference on the video PID.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7b9cf"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f7fb;font-size:19px}.title{font-size:25px;font-weight:600}.muted{fill:#c0ccdb}.label{font-size:17px}.accent{fill:#e7c578}</style><rect width="940" height="340" rx="12" fill="#152132"/><text x="28" y="38" class="title" text-anchor="start">PAT finds the programme map; PMT finds its streams</text><rect x="28" y="97" width="238" height="133" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="147" y="132" text-anchor="middle">PAT · PID 0</text><text x="147" y="171" class="muted" text-anchor="middle">Programme 7</text><text x="147" y="204" class="muted label" text-anchor="middle">PMT at PID 0x0100</text><rect x="337" y="68" width="272" height="228" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="473" y="105" text-anchor="middle">PMT · PID 0x0100</text><text x="473" y="140" class="muted" text-anchor="middle">Programme 7</text><text x="365" y="181" class="label" text-anchor="start">Video → PID 0x0101</text><text x="365" y="218" class="label" text-anchor="start">Audio → PID 0x0102</text><text x="365" y="264" class="muted label" text-anchor="start">PCR on PID 0x0101</text><rect x="681" y="86" width="231" height="83" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="796" y="119" text-anchor="middle">Video packets</text><text x="796" y="150" class="muted label" text-anchor="middle">PID 0x0101</text><rect x="681" y="208" width="231" height="83" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="796" y="241" text-anchor="middle">Audio packets</text><text x="796" y="272" class="muted label" text-anchor="middle">PID 0x0102</text><path d="M272 164H331" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M615 181H643V127H675" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M615 218H643V249H675" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/></svg>