<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340" role="img" aria-labelledby="title desc"><title id="title">Seeking and random access</title><desc id="desc">A seek target at ten point five seconds lies after the random access point at ten seconds. The player starts decoding at the earlier point and displays at the requested target.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7b9cf"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f7fb;font-size:19px}.title{font-size:25px;font-weight:600}.muted{fill:#c0ccdb}.label{font-size:17px}.accent{fill:#e7c578}</style><rect width="940" height="340" rx="12" fill="#152132"/><text x="28" y="38" class="title" text-anchor="start">Seeking locates a start, then decoding moves forward</text><text x="485" y="91" class="accent label" text-anchor="middle">Requested position</text><path d="M63 165H891" stroke="#a7b9cf" stroke-width="3"/><path d="M105 155V177" stroke="#a7b9cf" stroke-width="2"/><text x="105" y="208" class="muted label" text-anchor="middle">10.00 s</text><path d="M295 155V177" stroke="#a7b9cf" stroke-width="2"/><text x="295" y="208" class="muted label" text-anchor="middle">10.25 s</text><path d="M485 155V177" stroke="#a7b9cf" stroke-width="2"/><text x="485" y="208" class="muted label" text-anchor="middle">10.50 s</text><path d="M675 155V177" stroke="#a7b9cf" stroke-width="2"/><text x="675" y="208" class="muted label" text-anchor="middle">10.75 s</text><path d="M865 155V177" stroke="#a7b9cf" stroke-width="2"/><text x="865" y="208" class="muted label" text-anchor="middle">11.00 s</text><rect x="75" y="133" width="60" height="64" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="105" y="174" class="label" text-anchor="middle">RAP</text><rect x="835" y="133" width="60" height="64" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="865" y="174" class="label" text-anchor="middle">RAP</text><path d="M485 101V151" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M105 253H485" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><text x="295" y="288" class="muted label" text-anchor="middle">Decode from an earlier random access point</text><text x="485" y="315" class="accent label" text-anchor="middle">Begin display at the target</text></svg>