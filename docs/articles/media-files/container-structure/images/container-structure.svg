<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340" role="img" aria-labelledby="title desc"><title id="title">How a container organizes media</title><desc id="desc">The format header, track descriptions, encoded media and timing structures each have a different role. This is not a literal byte order.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7b9cf"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f7fb;font-size:19px}.title{font-size:25px;font-weight:600}.muted{fill:#c0ccdb}.label{font-size:17px}.accent{fill:#e7c578}</style><rect width="940" height="340" rx="12" fill="#152132"/><text x="28" y="38" class="title" text-anchor="start">How a container organizes media</text><rect x="28" y="105" width="192" height="147" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="124" y="144" class="label" text-anchor="middle">Format header</text><text x="124" y="184" class="muted label" text-anchor="middle">Recognize the</text><text x="124" y="213" class="muted label" text-anchor="middle">file structure</text><path d="M228 179 H248" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="257" y="105" width="192" height="147" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="353" y="144" class="label" text-anchor="middle">Track descriptions</text><text x="353" y="184" class="muted label" text-anchor="middle">Identify codecs</text><text x="353" y="213" class="muted label" text-anchor="middle">and track properties</text><path d="M457 179 H477" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="486" y="105" width="192" height="147" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="582" y="144" class="label" text-anchor="middle">Encoded media</text><text x="582" y="184" class="muted label" text-anchor="middle">Picture, sound</text><text x="582" y="213" class="muted label" text-anchor="middle">and subtitles</text><path d="M686 179 H706" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="715" y="105" width="197" height="147" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="813.5" y="144" class="label" text-anchor="middle">Timing and indexes</text><text x="813.5" y="184" class="muted label" text-anchor="middle">Align the tracks</text><text x="813.5" y="213" class="muted label" text-anchor="middle">and find positions</text><text x="470" y="295" class="muted" text-anchor="middle">Components shown conceptually; the byte layout varies.</text></svg>