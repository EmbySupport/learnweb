<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340" role="img" aria-labelledby="title desc"><title id="title">Muxing and demuxing</title><desc id="desc">Video packets V1 to V3 and audio packets A1 to A3 enter a muxer, form an illustrative interleaved sequence, and leave a demuxer as separate tracks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7b9cf"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f7fb;font-size:19px}.title{font-size:25px;font-weight:600}.muted{fill:#c0ccdb}.label{font-size:17px}.accent{fill:#e7c578}</style><rect width="940" height="340" rx="12" fill="#152132"/><text x="28" y="38" class="title" text-anchor="start">Muxing combines; demuxing separates</text><text x="35" y="79" class="muted label" text-anchor="start">Separate tracks</text><text x="480" y="102" class="muted label" text-anchor="middle">Interleaved packets</text><text x="794" y="79" class="muted label" text-anchor="start">Separate tracks</text><rect x="35" y="105" width="50" height="42" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="60" y="132" class="label" text-anchor="middle">V1</text><rect x="789" y="105" width="40" height="42" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="809" y="132" class="label" text-anchor="middle">V1</text><rect x="92" y="105" width="50" height="42" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="117" y="132" class="label" text-anchor="middle">V2</text><rect x="834" y="105" width="40" height="42" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="854" y="132" class="label" text-anchor="middle">V2</text><rect x="149" y="105" width="50" height="42" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="174" y="132" class="label" text-anchor="middle">V3</text><rect x="879" y="105" width="40" height="42" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="899" y="132" class="label" text-anchor="middle">V3</text><rect x="35" y="185" width="50" height="42" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="60" y="212" class="label" text-anchor="middle">A1</text><rect x="789" y="185" width="40" height="42" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="809" y="212" class="label" text-anchor="middle">A1</text><rect x="92" y="185" width="50" height="42" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="117" y="212" class="label" text-anchor="middle">A2</text><rect x="834" y="185" width="40" height="42" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="854" y="212" class="label" text-anchor="middle">A2</text><rect x="149" y="185" width="50" height="42" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="174" y="212" class="label" text-anchor="middle">A3</text><rect x="879" y="185" width="40" height="42" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="899" y="212" class="label" text-anchor="middle">A3</text><rect x="245" y="134" width="85" height="64" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="287" y="173" class="label" text-anchor="middle">Mux</text><rect x="665" y="134" width="95" height="64" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="712" y="173" class="label" text-anchor="middle">Demux</text><path d="M204 126 H218 V166 H240" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M204 206 H218 V166" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M335 166 H350" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M635 166 H660" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M765 166 H776 V126 H784" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M776 166 V206 H784" fill="none" stroke="#a7b9cf" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="355" y="145" width="42" height="42" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="376" y="172" class="label" text-anchor="middle">V1</text><rect x="401" y="145" width="42" height="42" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="422" y="172" class="label" text-anchor="middle">A1</text><rect x="447" y="145" width="42" height="42" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="468" y="172" class="label" text-anchor="middle">A2</text><rect x="493" y="145" width="42" height="42" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="514" y="172" class="label" text-anchor="middle">V2</text><rect x="539" y="145" width="42" height="42" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="560" y="172" class="label" text-anchor="middle">A3</text><rect x="585" y="145" width="42" height="42" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="606" y="172" class="label" text-anchor="middle">V3</text><text x="470" y="285" class="muted" text-anchor="middle">The encoded picture and sound need not be recompressed.</text></svg>