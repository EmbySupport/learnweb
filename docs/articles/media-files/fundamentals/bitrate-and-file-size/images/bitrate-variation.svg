<svg xmlns="http://www.w3.org/2000/svg" width="940" height="408" viewBox="0 0 940 408" role="img" aria-labelledby="title desc"><title id="title">Bitrate variation</title><desc id="desc">Four equal four-second intervals use six, twelve, twenty-four and six megabits per second. Their average is twelve megabits per second, shown as a dashed horizontal line.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7b9cf"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f7fb;font-size:19px}.title{font-size:25px;font-weight:600}.muted{fill:#c0ccdb}.label{font-size:17px}.accent{fill:#e7c578}</style><rect width="940" height="408" rx="12" fill="#152132"/><text x="28" y="38" class="title" text-anchor="start">Average bitrate hides changing demand</text><text x="28" y="73" class="muted label" text-anchor="start">Encoded data per second, measured over equal four-second intervals</text><text x="28" y="111" class="label" text-anchor="start">Mb/s</text><path d="M100 320H860" stroke="#33465f" stroke-width="1"/><text x="83" y="326" class="muted label" text-anchor="end">0</text><path d="M100 275H860" stroke="#33465f" stroke-width="1"/><text x="83" y="281" class="muted label" text-anchor="end">6</text><path d="M100 230H860" stroke="#33465f" stroke-width="1"/><text x="83" y="236" class="muted label" text-anchor="end">12</text><path d="M100 185H860" stroke="#33465f" stroke-width="1"/><text x="83" y="191" class="muted label" text-anchor="end">18</text><path d="M100 140H860" stroke="#33465f" stroke-width="1"/><text x="83" y="146" class="muted label" text-anchor="end">24</text><text x="195" y="259" class="label" text-anchor="middle">6</text><text x="385" y="214" class="label" text-anchor="middle">12</text><text x="575" y="124" class="label" text-anchor="middle">24</text><text x="765" y="259" class="label" text-anchor="middle">6</text><polygon points="100,320 100,275 290,275 290,230 480,230 480,140 670,140 670,275 860,275 860,320" fill="#65b9db" opacity=".13"/><polyline points="100,275 290,275 290,230 480,230 480,140 670,140 670,275 860,275" fill="none" stroke="#65b9db" stroke-width="4"/><path d="M100 230H860" stroke="#e7c578" stroke-width="2" stroke-dasharray="8 6"/><text x="853" y="218" class="accent label" text-anchor="end">12 Mb/s average</text><path d="M100 110V320H870" fill="none" stroke="#a7b9cf" stroke-width="2"/><text x="100" y="349" class="muted label" text-anchor="middle">0</text><text x="290" y="349" class="muted label" text-anchor="middle">4</text><text x="480" y="349" class="muted label" text-anchor="middle">8</text><text x="670" y="349" class="muted label" text-anchor="middle">12</text><text x="860" y="349" class="muted label" text-anchor="middle">16</text><text x="480" y="383" class="muted label" text-anchor="middle">Media time (seconds)</text></svg>