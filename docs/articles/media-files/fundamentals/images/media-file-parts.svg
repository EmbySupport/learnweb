<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340" role="img" aria-labelledby="title desc"><title id="title">One file, several components</title><desc id="desc">A container holds separate video, audio and subtitle tracks, with descriptions, timing and navigation alongside them.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a7b9cf"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f7fb;font-size:19px}.title{font-size:25px;font-weight:600}.muted{fill:#c0ccdb}.label{font-size:17px}.accent{fill:#e7c578}</style><rect width="940" height="340" rx="12" fill="#152132"/><text x="28" y="38" class="title" text-anchor="start">One file, several components</text><rect x="28" y="65" width="884" height="248" rx="8" fill="#192c41" stroke="#7e94af" stroke-width="1.5"/><rect x="55" y="91" width="505" height="53" rx="8" fill="#213b54" stroke="#65b9db" stroke-width="1.5"/><text x="78" y="124" text-anchor="start">Video</text><text x="300" y="124" class="label" text-anchor="start">Moving picture</text><rect x="55" y="163" width="505" height="53" rx="8" fill="#243f3b" stroke="#70c3a7" stroke-width="1.5"/><text x="78" y="196" text-anchor="start">Audio</text><text x="300" y="196" class="label" text-anchor="start">Soundtrack</text><rect x="55" y="235" width="505" height="53" rx="8" fill="#413850" stroke="#b398d3" stroke-width="1.5"/><text x="78" y="268" text-anchor="start">Subtitles</text><text x="300" y="268" class="label" text-anchor="start">Text or overlay images</text><rect x="597" y="91" width="287" height="197" rx="8" fill="#202d40" stroke="#7e94af" stroke-width="1.5"/><text x="618" y="123" text-anchor="start">Alongside the media</text><text x="618" y="157" class="muted label" text-anchor="start">Track descriptions</text><text x="618" y="191" class="muted label" text-anchor="start">Timing and alignment</text><text x="618" y="225" class="muted label" text-anchor="start">Indexes and chapters</text><text x="618" y="259" class="muted label" text-anchor="start">Other metadata</text></svg>