<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="title desc"><title id="title">Three jobs inside an MP4</title><desc id="desc">The ftyp box declares the file conventions. The moov box describes tracks and timing, and the mdat box contains encoded samples.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#25324a} .heading{font-size:25px;font-weight:600} .label{font-size:21px;font-weight:600} .note{font-size:17px} .sub{font-size:18px} .box{stroke:#577089;stroke-width:2} .line{stroke:#546b85;stroke-width:2;fill:none}</style><rect width="900" height="270" fill="#f7f9fc" rx="14"/><text x="30" y="41" class="heading">Three jobs inside an MP4</text><rect x="30" y="82" width="160" height="104" rx="7" class="box" fill="#eee4ff"/><text x="110" y="131" text-anchor="middle" class="label">ftyp</text><text x="110" y="160" text-anchor="middle" class="sub">Format brands</text><rect x="215" y="82" width="240" height="104" rx="7" class="box" fill="#dbeafe"/><text x="335" y="131" text-anchor="middle" class="label">moov</text><text x="335" y="160" text-anchor="middle" class="sub">Tracks and timing</text><rect x="480" y="82" width="390" height="104" rx="7" class="box" fill="#d5f2e5"/><text x="675" y="131" text-anchor="middle" class="label">mdat</text><text x="675" y="160" text-anchor="middle" class="sub">Encoded picture and sound</text><text x="30" y="235" class="note">Example order only • optional boxes omitted • sizes vary by file</text></svg>
