<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 315" role="img" aria-labelledby="title desc"><title id="title">TS packets and M2TS stored units</title><desc id="desc">A transport stream packet is 188 bytes. Blu-ray M2TS stores a four-byte prefix followed by each 188-byte packet.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#25324a} .heading{font-size:25px;font-weight:600} .label{font-size:21px;font-weight:600} .note{font-size:17px} .sub{font-size:18px} .box{stroke:#577089;stroke-width:2} .line{stroke:#546b85;stroke-width:2;fill:none}</style><rect width="900" height="315" fill="#f7f9fc" rx="14"/><text x="30" y="41" class="heading">TS packets and M2TS stored units</text><text x="30" y="87" class="label">TS: 188 bytes</text><rect x="30" y="105" width="215" height="65" rx="7" class="box" fill="#dbeafe"/><text x="137.5" y="144.5" text-anchor="middle" class="label">TS header</text><rect x="245" y="105" width="625" height="65" rx="7" class="box" fill="#d5f2e5"/><text x="557.5" y="144.5" text-anchor="middle" class="label">Adaptation field and/or payload</text><text x="30" y="212" class="label">M2TS: 192 bytes</text><rect x="30" y="228" width="210" height="65" rx="7" class="box" fill="#eee4ff"/><text x="135" y="267.5" text-anchor="middle" class="label">4-byte prefix</text><rect x="240" y="228" width="630" height="65" rx="7" class="box" fill="#dbeafe"/><text x="555" y="267.5" text-anchor="middle" class="label">188-byte TS packet</text></svg>
