<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">Fast start changes the box order</title><desc id="desc">A conventional MP4 with moov after mdat is rewritten with moov before mdat. Encoded samples in mdat stay the same.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#25324a} .heading{font-size:25px;font-weight:600} .label{font-size:21px;font-weight:600} .note{font-size:17px} .sub{font-size:18px} .box{stroke:#577089;stroke-width:2} .line{stroke:#546b85;stroke-width:2;fill:none}</style><rect width="900" height="350" fill="#f7f9fc" rx="14"/><text x="30" y="41" class="heading">Fast start changes the box order</text><text x="30" y="87" class="sub">Movie description at the end</text><rect x="30" y="103" width="105" height="72" rx="7" class="box" fill="#eee4ff"/><text x="82.5" y="146" text-anchor="middle" class="label">ftyp</text><rect x="135" y="103" width="505" height="72" rx="7" class="box" fill="#d5f2e5"/><text x="387.5" y="146" text-anchor="middle" class="label">mdat: encoded media</text><rect x="640" y="103" width="230" height="72" rx="7" class="box" fill="#dbeafe"/><text x="755" y="146" text-anchor="middle" class="label">moov</text><text x="30" y="222" class="sub">Fast-start layout</text><rect x="30" y="239" width="105" height="72" rx="7" class="box" fill="#eee4ff"/><text x="82.5" y="282" text-anchor="middle" class="label">ftyp</text><rect x="135" y="239" width="230" height="72" rx="7" class="box" fill="#dbeafe"/><text x="250" y="282" text-anchor="middle" class="label">moov</text><rect x="365" y="239" width="505" height="72" rx="7" class="box" fill="#d5f2e5"/><text x="617.5" y="282" text-anchor="middle" class="label">mdat: same samples</text><text x="30" y="338" class="note">Locations are updated after moving boxes • codec and picture quality do not change</text></svg>
