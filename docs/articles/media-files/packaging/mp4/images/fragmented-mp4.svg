<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc"><title id="title">Initialization, then successive fragments</title><desc id="desc">An initialization section with ftyp and moov is followed by two example fragments, each with moof and mdat boxes.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#25324a} .heading{font-size:25px;font-weight:600} .label{font-size:21px;font-weight:600} .note{font-size:17px} .sub{font-size:18px} .box{stroke:#577089;stroke-width:2} .line{stroke:#546b85;stroke-width:2;fill:none}</style><rect width="900" height="310" fill="#f7f9fc" rx="14"/><text x="30" y="41" class="heading">Initialization, then successive fragments</text><text x="30" y="92" class="sub">Initialization</text><text x="300" y="92" class="sub">Fragment 1</text><text x="585" y="92" class="sub">Fragment 2</text><rect x="30" y="112" width="105" height="90" rx="7" class="box" fill="#eee4ff"/><text x="82.5" y="164" text-anchor="middle" class="label">ftyp</text><rect x="135" y="112" width="125" height="90" rx="7" class="box" fill="#dbeafe"/><text x="197.5" y="164" text-anchor="middle" class="label">moov</text><rect x="300" y="112" width="115" height="90" rx="7" class="box" fill="#dbeafe"/><text x="357.5" y="164" text-anchor="middle" class="label">moof</text><rect x="415" y="112" width="135" height="90" rx="7" class="box" fill="#d5f2e5"/><text x="482.5" y="164" text-anchor="middle" class="label">mdat</text><rect x="585" y="112" width="115" height="90" rx="7" class="box" fill="#dbeafe"/><text x="642.5" y="164" text-anchor="middle" class="label">moof</text><rect x="700" y="112" width="135" height="90" rx="7" class="box" fill="#d5f2e5"/><text x="767.5" y="164" text-anchor="middle" class="label">mdat</text><text x="30" y="250" class="note">moov: track setup • moof: this fragment’s samples • mdat: encoded media</text><text x="30" y="279" class="note">A fragment may need its initialization information and earlier decoded pictures.</text></svg>
