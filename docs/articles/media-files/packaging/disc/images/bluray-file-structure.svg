<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">The main parts of a Blu-ray movie folder</title><desc id="desc">Within BDMV, PLAYLIST files select STREAM clips and ranges, while matching CLIPINF files describe the clips and access information. Index and movie-object files provide presentation navigation.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#25324a} .heading{font-size:25px;font-weight:600} .label{font-size:21px;font-weight:600} .note{font-size:17px} .sub{font-size:18px} .box{stroke:#577089;stroke-width:2} .line{stroke:#546b85;stroke-width:2;fill:none}</style><rect width="900" height="420" fill="#f7f9fc" rx="14"/><text x="30" y="41" class="heading">The main parts of a Blu-ray movie folder</text><rect x="30" y="72" width="840" height="60" rx="7" class="box" fill="#eee4ff"/><text x="450" y="109" text-anchor="middle" class="label">BDMV</text><rect x="30" y="163" width="245" height="85" rx="7" class="box" fill="#dbeafe"/><text x="152.5" y="202.5" text-anchor="middle" class="label">PLAYLIST</text><text x="152.5" y="231.5" text-anchor="middle" class="sub">Sequence and ranges</text><rect x="328" y="163" width="245" height="85" rx="7" class="box" fill="#dbeafe"/><text x="450.5" y="202.5" text-anchor="middle" class="label">CLIPINF</text><text x="450.5" y="231.5" text-anchor="middle" class="sub">Clip descriptions</text><rect x="625" y="163" width="245" height="85" rx="7" class="box" fill="#d5f2e5"/><text x="747.5" y="202.5" text-anchor="middle" class="label">STREAM</text><text x="747.5" y="231.5" text-anchor="middle" class="sub">M2TS media</text><path d="M275 205 L326 205" class="line"/><path d="M573 205 L622 205" class="line"/><text x="30" y="287" class="note">A playlist chooses ranges from clips; clip information describes their access points.</text><rect x="30" y="315" width="840" height="65" rx="7" class="box" fill="#eee4ff"/><text x="450" y="344.5" text-anchor="middle" class="label">index.bdmv and MovieObject.bdmv</text><text x="450" y="373.5" text-anchor="middle" class="sub">Presentation entry points and navigation</text></svg>
