<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">An ordered edition defines the sequence</title><desc id="desc">The ordered edition requests a shared opening, then a main episode, then a shared ending from separately stored segments.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#25324a} .heading{font-size:25px;font-weight:600} .label{font-size:21px;font-weight:600} .note{font-size:17px} .sub{font-size:18px} .box{stroke:#577089;stroke-width:2} .line{stroke:#546b85;stroke-width:2;fill:none}</style><rect width="900" height="350" fill="#f7f9fc" rx="14"/><text x="30" y="41" class="heading">An ordered edition defines the sequence</text><rect x="30" y="83" width="225" height="87" rx="7" class="box" fill="#eee4ff"/><text x="142.5" y="123.5" text-anchor="middle" class="label">Shared opening</text><text x="142.5" y="152.5" text-anchor="middle" class="sub">Linked segment</text><rect x="335" y="83" width="230" height="87" rx="7" class="box" fill="#dbeafe"/><text x="450" y="123.5" text-anchor="middle" class="label">Episode body</text><text x="450" y="152.5" text-anchor="middle" class="sub">Current segment</text><rect x="645" y="83" width="225" height="87" rx="7" class="box" fill="#eee4ff"/><text x="757.5" y="123.5" text-anchor="middle" class="label">Shared ending</text><text x="757.5" y="152.5" text-anchor="middle" class="sub">Linked segment</text><path d="M143 171 L143 215" class="line"/><path d="M450 171 L450 215" class="line"/><path d="M757 171 L757 215" class="line"/><rect x="30" y="215" width="840" height="83" rx="7" class="box" fill="#d5f2e5"/><text x="450" y="253.5" text-anchor="middle" class="label">Played sequence: opening → episode → ending</text><text x="450" y="282.5" text-anchor="middle" class="sub">Ranges and references come from the ordered edition</text><text x="30" y="331" class="note">The reader must resolve linked media and implement ordered-edition playback.</text></svg>
