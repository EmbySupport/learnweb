<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="575" viewBox="0 0 1080 575" role="img" aria-labelledby="title desc"><title id="title">Binaural directional cues</title><desc id="desc">A sound to the left follows unequal paths to the left and right ears, causing direction-dependent timing, level, and spectral cues.</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#263238"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#879099"/></marker></defs><text x="540" y="44" font-size="28" fill="#263238" text-anchor="middle">A direction creates different signals at the ears</text><circle cx="150" cy="157" r="32" fill="#fff4e7" stroke="#c27421" stroke-width="3"/><text x="150" y="169" font-size="34" fill="#c27421" text-anchor="middle">♪</text><text x="150" y="107" font-size="23" fill="#915419" text-anchor="middle">Sound source</text><ellipse cx="617" cy="320" rx="85" ry="106" fill="#e8f3e6" stroke="#31852b" stroke-width="3"/><path d="M 598 215 L 617 197 L 636 215" fill="#e8f3e6" stroke="#31852b" stroke-width="3"/><ellipse cx="524" cy="320" rx="12" ry="27" fill="#e8f3e6" stroke="#31852b" stroke-width="3"/><ellipse cx="710" cy="320" rx="12" ry="27" fill="#e8f3e6" stroke="#31852b" stroke-width="3"/><line x1="180" y1="175" x2="511" y2="313" stroke="#879099" stroke-width="3" marker-end="url(#arrow)"/><path d="M180 174 Q720 56 711 293" fill="none" stroke="#879099" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="306" y="264" font-size="22" fill="#3779b5" text-anchor="middle">Near-ear path</text><text x="601" y="118" font-size="22" fill="#3779b5" text-anchor="middle">Far-ear path: around the head</text><text x="454" y="366" font-size="19" fill="#263238" text-anchor="middle">Left ear</text><text x="778" y="366" font-size="19" fill="#263238" text-anchor="middle">Right ear</text><text x="616" y="463" font-size="21" fill="#31852b" text-anchor="middle">Listener faces forward</text><text x="540" y="533" font-size="19" fill="#546e7a" text-anchor="middle">Timing, level, and spectral cues differ. No numerical delay or response is implied.</text></g></svg>