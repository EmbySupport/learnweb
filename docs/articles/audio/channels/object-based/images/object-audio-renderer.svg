<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">Object-based audio rendering</title><desc id="desc">Audio components and spatial metadata enter a renderer, which generates signals for supported speakers or headphones.</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#263238"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#879099"/></marker></defs><text x="560" y="47" font-size="29" fill="#263238" text-anchor="middle">From spatial description to listening signals</text><rect x="40" y="150" width="280" height="108" rx="14" stroke="#3779b5" stroke-width="2.5" fill="#eaf3f9"/><text x="180" y="200" font-size="24" fill="#3779b5" text-anchor="middle">Audio components</text><text x="180" y="231" font-size="19" fill="#546e7a" text-anchor="middle">Objects and channel beds</text><rect x="40" y="333" width="280" height="108" rx="14" stroke="#3779b5" stroke-width="2.5" fill="#eaf3f9"/><text x="180" y="383" font-size="24" fill="#3779b5" text-anchor="middle">Spatial metadata</text><text x="180" y="414" font-size="19" fill="#546e7a" text-anchor="middle">Positions and movement</text><rect x="432" y="242" width="238" height="120" rx="14" stroke="#31852b" stroke-width="2.5" fill="#e8f3e6"/><text x="551" y="298" font-size="24" fill="#31852b" text-anchor="middle">Renderer</text><text x="551" y="329" font-size="19" fill="#546e7a" text-anchor="middle">Uses supported layout</text><rect x="793" y="150" width="287" height="108" rx="14" stroke="#3779b5" stroke-width="2.5" fill="#eaf3f9"/><text x="936.5" y="200" font-size="24" fill="#3779b5" text-anchor="middle">Speaker signals</text><text x="936.5" y="231" font-size="19" fill="#546e7a" text-anchor="middle">For the available positions</text><rect x="793" y="333" width="287" height="108" rx="14" stroke="#3779b5" stroke-width="2.5" fill="#eaf3f9"/><text x="936.5" y="383" font-size="24" fill="#3779b5" text-anchor="middle">Headphone signals</text><text x="936.5" y="414" font-size="19" fill="#546e7a" text-anchor="middle">A binaural presentation</text><line x1="320" y1="205" x2="432" y2="282" stroke="#879099" stroke-width="3" marker-end="url(#arrow)"/><line x1="320" y1="387" x2="432" y2="324" stroke="#879099" stroke-width="3" marker-end="url(#arrow)"/><line x1="670" y1="282" x2="793" y2="205" stroke="#879099" stroke-width="3" marker-end="url(#arrow)"/><line x1="670" y1="324" x2="793" y2="387" stroke="#879099" stroke-width="3" marker-end="url(#arrow)"/><text x="551" y="525" font-size="19" fill="#546e7a" text-anchor="middle">Conceptual path: delivery codecs may combine and reconstruct components.</text></g></svg>