<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="248" viewBox="0 0 1120 248" role="img" aria-labelledby="title desc"><title id="title">From a stored track to audible sound</title><desc id="desc">Five stages: selected file track, Emby delivery, player decode or pass through, supported audio output, and receiver or DAC playback.</desc><rect width="100%" height="100%" rx="16" fill="#0e1726"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#69cbe9"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif" fill="#edf4fc"><text x="32" y="42" font-size="25" font-weight="600">The audio path has several separate decisions</text><rect x="32" y="79" width="174" height="91" rx="10" fill="#1c2c43" stroke="#4f7494"/><text x="119" y="117" text-anchor="middle" font-size="20" font-weight="600">Selected track</text><text x="119" y="147" text-anchor="middle" font-size="16" fill="#b9ccdf">Codec + presentation</text><path d="M212 124 H239" fill="none" stroke="#69cbe9" stroke-width="3" marker-end="url(#arrow)"/><rect x="253" y="79" width="174" height="91" rx="10" fill="#1c2c43" stroke="#4f7494"/><text x="340" y="117" text-anchor="middle" font-size="20" font-weight="600">Emby delivery</text><text x="340" y="147" text-anchor="middle" font-size="16" fill="#b9ccdf">Copy or convert</text><path d="M433 124 H460" fill="none" stroke="#69cbe9" stroke-width="3" marker-end="url(#arrow)"/><rect x="474" y="79" width="174" height="91" rx="10" fill="#1c2c43" stroke="#4f7494"/><text x="561" y="117" text-anchor="middle" font-size="20" font-weight="600">Player</text><text x="561" y="147" text-anchor="middle" font-size="16" fill="#b9ccdf">Decode or pass</text><path d="M654 124 H681" fill="none" stroke="#69cbe9" stroke-width="3" marker-end="url(#arrow)"/><rect x="695" y="79" width="174" height="91" rx="10" fill="#1c2c43" stroke="#4f7494"/><text x="782" y="117" text-anchor="middle" font-size="20" font-weight="600">Audio output</text><text x="782" y="147" text-anchor="middle" font-size="16" fill="#b9ccdf">Supported format</text><path d="M875 124 H902" fill="none" stroke="#69cbe9" stroke-width="3" marker-end="url(#arrow)"/><rect x="916" y="79" width="174" height="91" rx="10" fill="#1c2c43" stroke="#4f7494"/><text x="1003" y="117" text-anchor="middle" font-size="20" font-weight="600">Receiver / DAC</text><text x="1003" y="147" text-anchor="middle" font-size="16" fill="#b9ccdf">Render + playback</text><text x="32" y="211" font-size="17" fill="#b9ccdf">The source codec, server delivery method, and receiver input can have different labels.</text></g></svg>